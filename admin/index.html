<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocab · Admin</title>
<link rel="icon" href="/app/icon.svg">
<link rel="stylesheet" href="/admin.css">
</head><body>
<header>
  <div class="brand">Vocab<span>Admin</span></div>
  <div class="hr"><a class="btn ghost" href="/app/" target="_blank">Open app</a><button class="btn pri" id="pub">Publish</button></div>
</header>
<main>
  <section class="col" id="users">
    <div class="ch"><h2>Users</h2><span class="mut" id="uN"></span></div>
    <input id="uQ" placeholder="Search name or email">
    <div class="list" id="uL"></div>
  </section>
  <section class="col" id="files">
    <div class="ch"><h2>Vocabulary files</h2><span class="mut" id="fN"></span></div>
    <label class="drop" id="drop">
      <input type="file" id="fIn" accept=".json,application/json" multiple hidden>
      <b>Drop .json files here</b><span class="mut">or click to choose from your computer · same id = replaced</span>
    </label>
    <div class="list" id="fL"></div>
  </section>
</main>
<div id="dlg"></div><div id="toast"></div>
<script src="/admin.js"></script>
</body></html>
